general.import = [
  "~/.config/alacritty/themes/themes/solarized_dark.toml"
]

[[keyboard.bindings]]
chars = '\'
key = "¥"

[[keyboard.bindings]]
chars = "¥"
key = "¥"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B"
key = "LBracket"
mods = "Control"

[[keyboard.bindings]]
key = "Enter"
mods = "Alt"
chars = "\u001b[13;3u"

[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001b[13;2u"

[font]
size = 14

[font.bold]
family = "mononoki Nerd Font"
style = "Bold"

[font.bold_italic]
family = "mononoki Nerd Font"
style = "Bold Italic"

[font.italic]
family = "mononoki Nerd Font"
style = "Italic"

[font.normal]
family = "mononoki Nerd Font"
style = "Regular"

[window]
decorations = "buttonless"
